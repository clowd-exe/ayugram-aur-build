name: Build AUR package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ayugram.yml"

permissions:
  contents: read

jobs:
  build:
    name: ayugram-desktop (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: archlinux:base-devel

    steps:
      - name: Update Arch container
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git sudo nodejs

      - name: Create unprivileged build user
        run: |
          useradd -m -G wheel builder
          printf '%%wheel ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/wheel
          chmod 0440 /etc/sudoers.d/wheel

      - name: Build libtg_owt-git (AUR dependency)
        run: |
          sudo -u builder -H git clone --depth=1 https://aur.archlinux.org/libtg_owt-git.git /home/builder/libtg_owt-git
          sudo -u builder -H bash -lc 'cd ~/libtg_owt-git && makepkg -si --noconfirm --noprogressbar --clean'

      - name: Build ayugram-desktop
        run: |
          sudo -u builder -H git clone --depth=1 https://aur.archlinux.org/ayugram-desktop.git /home/builder/ayugram-desktop
          sudo -u builder -H bash -lc 'cd ~/ayugram-desktop && makepkg -si --noconfirm --noprogressbar --clean'

      - name: Collect package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v /home/builder/ayugram-desktop/*.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-desktop-x86_64
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
